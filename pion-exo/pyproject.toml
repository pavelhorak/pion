[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pion-exo"
version = "0.2.0"
description = "Pion attention hook for exo distributed inference — V offloading + Stage-2 Metal SDPA via PionPromptCache"
readme = "README.md"
requires-python = ">=3.10"
# Apache-2.0 since 2026-09-22 (decided with the other client packages —
# see doc/licensing.md). gh #256 had corrected an earlier "MIT" to the then-BSL;
# the in-package LICENSE carries the verbatim text and hatchling ships it.
license = { text = "Apache-2.0" }
keywords = ["exo", "pion", "attention", "kv-cache", "distributed-inference", "apple-silicon"]
dependencies = [
    "numpy>=1.24.0",
    "redis>=4.6.0",
]

[project.optional-dependencies]
# gpu_attention mode pulls in pion-vllm-mlx for PionPromptCache(stage2=True).
# v_offload mode does not need this. mlx itself is lazy-imported via
# PionPromptCache._require_mlx, so installing this on Linux is safe.
gpu = ["pion-vllm-mlx"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["pion_exo"]
