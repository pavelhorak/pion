[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pion-glide"
version = "0.1.0"
description = "Valkey GLIDE–based Python client for Pion — typed FT.* and AI.* wrappers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["pion", "vector-database", "glide", "valkey", "redis", "hnsw", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "valkey-glide>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/pavelhorak/pion"
Documentation = "https://github.com/pavelhorak/pion/blob/main/pion_glide/README.md"
Issues = "https://github.com/pavelhorak/pion/issues"

[tool.hatch.build.targets.wheel]
packages = ["pion_glide"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
