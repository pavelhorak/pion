[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pion-mcp"
version = "0.1.0"
description = "MCP server for Pion — Redis-compatible vector database with HNSW search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "vector-database", "redis", "semantic-search", "hnsw"]
dependencies = [
    "mcp[cli]>=1.0.0,<2",   # 2.x renamed FastMCP → MCPServer; server.py is 1.x API
    "redis>=4.6.0",         # Pion speaks RESP2 and RESP3 (gh #172); no upper bound
    "numpy>=1.24.0",
    "httpx>=0.27.0",        # HTTP client for the embedding/LLM proxy
    "openai>=1.0.0",        # default embedding provider
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
pion-mcp = "pion_mcp.server:main"

[project.entry-points."mcp.servers"]
pion = "pion_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pion_mcp"]
