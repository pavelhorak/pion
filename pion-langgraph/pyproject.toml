[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pion-langgraph"
version = "0.1.0"
description = "LangGraph checkpoint saver backed by Pion — deterministic low-latency agent state persistence"
readme = "README.md"
requires-python = ">=3.10"
# Apache-2.0 since 2026-09-22 (decided with the other client packages —
# see doc/licensing.md). gh #256 had corrected an earlier "MIT" to the then-BSL;
# the in-package LICENSE carries the verbatim text and hatchling ships it.
license = { text = "Apache-2.0" }
keywords = ["langgraph", "checkpoint", "pion", "ai-agents", "vector-database"]
dependencies = [
    "redis>=4.6.0",
    "langgraph-checkpoint>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "langgraph>=0.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["pion_langgraph"]
