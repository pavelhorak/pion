[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pion-llamaindex"
version = "0.1.0"
description = "LlamaIndex vector store backed by Pion — sub-millisecond RAG retrieval"
readme = "README.md"
requires-python = ">=3.10"
# Apache-2.0 since 2026-09-22 (decided with the other client packages —
# see doc/licensing.md). gh #256 had corrected an earlier "MIT" to the then-BSL;
# the in-package LICENSE carries the verbatim text and hatchling ships it.
license = { text = "Apache-2.0" }
keywords = ["llamaindex", "vector-store", "pion", "rag", "vector-database"]
dependencies = [
    "redis>=4.6.0",
    "llama-index-core>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest", "llama-index>=0.11.0"]

[tool.hatch.build.targets.wheel]
packages = ["pion_llamaindex"]
