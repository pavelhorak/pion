[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pionlite"
version = "0.0.0"               # build_wheel.sh stamps the engine's VERSION
description = "The Pion engine in your process, behind redis-py: Redis semantics with per-command durability and no server"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["redis>=5"]

[tool.setuptools]
packages = ["pionlite"]

[tool.setuptools.package-data]
pionlite = ["_lib/*.dylib", "_lib/*.so", "py.typed"]
