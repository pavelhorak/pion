# mlx-lm seam matrix (gh #263)
#
# `install_pion_attention_patch()` monkey-patches a PRIVATE mlx-lm function and
# rebinds the snapshot-bound name in every imported `mlx_lm.models.*` module.
# Nothing upstream promises that shape — it has already moved once (`sinks`) —
# and it is the first thing the launch wedge installs. This job is what turns an
# upstream release into a red check instead of a TypeError in a user's
# generation loop.
#
# ── WHY workflow_dispatch ONLY ────────────────────────────────────────────────
# This repository is private, where hosted runners bill metered minutes — and
# macOS runners bill at a 10x multiplier, so a per-push matrix would be the most
# expensive job in the repo. GitHub Actions is free on standard runners for
# PUBLIC repositories, so at publication the `pull_request` trigger below gets
# uncommented and this becomes an ordinary check.
#
# Until then the equivalent runs locally and costs nothing:
#     pion-vllm-mlx/tests/run_mlx_version_matrix.sh
# which builds one throwaway venv per version and runs the identical two gates.
#
# Both gates are download-free: no model weights, no pion-server, no network
# beyond pip. `tests/test_mlx_lm_patch.py` is deliberately NOT here — it needs a
# running `--kvcache` server and Llama-3.2-1B cached, so it is a hand-run
# end-to-end gate, not a matrix job.

name: mlx-lm seam matrix

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated mlx-lm versions (blank = the matrix below)"
        required: false
        default: ""
  # Enabled 2026-09-19 for the public repo: hosted minutes are free there, and
  # this is the check that turns an upstream mlx-lm release into a red tick
  # instead of a TypeError inside a user's generation loop.
  pull_request:
    paths:
      - "pion-vllm-mlx/**"
      - ".github/workflows/mlx-seam-matrix.yml"

jobs:
  seam:
    # macos-14+ is Apple Silicon; mlx ships no wheels for anything else.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Floor, two points between, and the tested ceiling. Keep the last entry
        # in step with pion-vllm-mlx/pyproject.toml's `<0.32` and
        # pion_vllm_mlx/_compat.py's MAX_TESTED_MLX_LM.
        mlx_lm: ["0.20.1", "0.24.1", "0.28.4", "0.31.3"]
    name: mlx-lm ${{ matrix.mlx_lm }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mlx-lm ${{ matrix.mlx_lm }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mlx-lm==${{ matrix.mlx_lm }}" numpy

      - name: Report the seam
        run: |
          python -c "import sys; sys.path.insert(0,'pion-vllm-mlx'); \
            import json, pion_vllm_mlx._compat as c; \
            print(json.dumps(c.describe(), indent=2, default=str))"

      - name: Seam conformance
        run: python pion-vllm-mlx/tests/test_mlx_lm_seam.py

      - name: Gemma-4 12B layer routing (pure python)
        run: python pion-vllm-mlx/tests/test_gemma4_12b_layer_routing.py
