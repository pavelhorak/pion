# Contributor Licence Agreement (gh #298, decision D4).
#
# WHY A CLA AND NOT A DCO
#
# Pion is Apache-2.0 with one separately licensed binary library, and keeping
# any future relicensing possible only works if one party holds the rights. A DCO certifies provenance — that you
# had the right to submit the code — but it does not transfer or licence
# anything to the project, so a repository built on DCO sign-offs cannot be
# relicensed without tracking down every contributor. That is the specific
# thing this project cannot afford, so it is a CLA, and only a CLA. One
# mechanism, not two.
#
# TIMING
#
# A CLA cannot be collected retroactively in any meaningful sense, so this has
# to exist before the first external pull request — which is not the same as
# before the repository goes public. If a PR arrives in the window before this
# is live, ask for the signature on that PR.
#
# Signatures are stored as a JSON file on a `cla-signatures` branch of this
# repository. Nothing is emailed anywhere and no third-party service holds it.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write          # write the signature file
  pull-requests: write     # comment on the PR
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    # Skip the bot's own comments, and skip Dependabot-style actors that
    # cannot sign anything.
    if: >-
      (github.event.comment.body == 'recheck' ||
       startsWith(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/pavelhorak/pion/blob/main/CLA.md'
          branch: 'cla-signatures'
          # `claude` is the co-author GitHub resolves for the Co-Authored-By:
          # Claude trailer on the maintainer's AI-assisted commits; the human
          # committer still has to be on this list or have signed.
          allowlist: 'pavelhorak,dependabot[bot],claude'
          custom-notsigned-prcomment: >-
            Thanks for the pull request — before it can be merged, Pion needs a
            signed Contributor Licence Agreement. This is because any future
            relicensing of Pion only works if one party holds the rights to
            make it. You keep your copyright.


            Please read [CLA.md](https://github.com/pavelhorak/pion/blob/main/CLA.md)
            and, if you agree, post exactly this as a comment on this PR:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: >-
            CLA signed — thank you. This does not need doing again for future
            pull requests.
