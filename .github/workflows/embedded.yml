name: Embedded Pion

# The engine as an in-process library (embedded/README.md), on all three
# platforms the release ships: build libpion, run the server's correctness
# suites and then the server-facing test tier through it (tests/run_all.py
# with embedded/tests/pion-server-embedded standing in for pion-server), build
# the cp311-abi3 wheel and check it installs and runs in clean venvs with the
# toolchain hidden. A fourth job probes whether an Ubuntu 22.04 build host
# lowers the glibc floor; it reports and never fails the run.
on:
  pull_request:
    paths:
      - 'embedded/**'
      - 'src/lib/pion_embed.mojo'
      - 'tests/run_all.py'
      - '.github/workflows/embedded.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: run_all tier through the library (none skips it)
        type: choice
        default: gate
        options: [none, gate, full]

permissions:
  contents: read

env:
  TIER: ${{ inputs.tier || 'gate' }}

jobs:
  linux:
    name: ${{ matrix.leg }}
    strategy:
      fail-fast: false
      matrix:
        leg: [linux-x86_64, linux-arm64]
    runs-on: ${{ matrix.leg == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-key: pixi-${{ matrix.leg }}-${{ hashFiles('pixi.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Swap, for the compiler's peak
        # At the default thread count the shared-library build's memory got
        # the runner shut down ("received a shutdown signal") on both legs.
        run: |
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g

      - name: Build libpion.so
        env:
          PION_EMBED_JOBS: '2'
        run: bash embedded/build_linux.sh

      - name: Test dependencies
        # 3.13 runs the adapters (redis-py 5+); 3.12 runs the test tier with
        # the redis-py the Linux gate tier pins (4.6.0).
        run: |
          python3.13 -m pip install --quiet redis patchelf setuptools wheel
          python3.12 -m pip install --quiet 'redis==4.6.0' numpy requests pyarrow pyyaml flask

      - name: Smoke test through the library (ctypes, from the tree)
        env:
          PYTHONPATH: embedded/python
          PION_EMBED_LIB: ${{ github.workspace }}/libpion.so
          PION_EMBED_CTYPES: '1'
        run: python3.13 embedded/tests/test_smoke.py

      - name: Redis 8.10.2, the differential tests' oracle
        if: env.TIER != 'none'
        run: |
          git clone -q --depth 1 --branch 8.10.2 https://github.com/redis/redis.git "$RUNNER_TEMP/redis"
          make -C "$RUNNER_TEMP/redis" -j"$(nproc)" BUILD_TLS=no > /dev/null
          echo "$RUNNER_TEMP/redis/src" >> "$GITHUB_PATH"

      - name: Test tier through the library
        # Gate 1, parity, the dispatch sweep and the transaction probe are in
        # the tier, each against a fresh library-mode server.
        if: env.TIER != 'none'
        env:
          PION_EMBED_LIB: ${{ github.workspace }}/libpion.so
          PION_EMBED_CTYPES: '1'
        run: |
          python3.12 tests/run_all.py --tier "$TIER" --server-tests-only \
            --binary embedded/tests/pion-server-embedded --report build/embedded-tier.json

      - name: Upload the tier's logs
        if: always() && env.TIER != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-${{ env.TIER }}-tier-${{ matrix.leg }}
          path: |
            build/test-logs/
            build/embedded-tier.json
          retention-days: 14

      - name: Build the wheel
        run: bash embedded/build_wheel.sh python3.13

      - name: The wheel installs and runs in clean venvs (3.11, 3.13), toolchain hidden
        run: |
          set -e
          W=$(ls embedded/dist/*.whl)
          echo "wheel: $W"
          mv .pixi/envs/default/lib .pixi/envs/default/lib.hidden
          for v in 3.11 3.13; do
            python$v -m venv /tmp/w$v
            /tmp/w$v/bin/pip install --quiet "$W"
            (cd /tmp && /tmp/w$v/bin/python -c "import pion_embedded as p, tempfile; r = p.Redis(dir=tempfile.mkdtemp()); r.ping(); print('$v binding', r.pion_engine.binding)")
            (cd /tmp && /tmp/w$v/bin/python $GITHUB_WORKSPACE/embedded/tests/test_smoke.py)
          done
          mv .pixi/envs/default/lib.hidden .pixi/envs/default/lib

      - name: Keep the wheel
        uses: actions/upload-artifact@v4
        with:
          name: pion-embedded-wheel-${{ matrix.leg }}
          path: embedded/dist/*.whl

  macos:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 240
    env:
      # As release.yml: the library and the wheel load on macOS 14.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-key: pixi-macos-arm64-${{ hashFiles('pixi.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Build libpion.dylib
        run: pixi run build-embed

      - name: The library must load on macOS 14
        run: |
          minos=$(otool -l libpion.dylib | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "minos $minos"
          [ "$minos" = "$MACOSX_DEPLOYMENT_TARGET" ]

      - name: Test dependencies
        run: |
          python3.13 -m pip install --quiet redis setuptools wheel
          python3.12 -m pip install --quiet 'redis==4.6.0' numpy requests pyarrow pyyaml flask

      - name: Smoke test through the library (ctypes, from the tree)
        env:
          PYTHONPATH: embedded/python
          PION_EMBED_LIB: ${{ github.workspace }}/libpion.dylib
          PION_EMBED_CTYPES: '1'
        run: python3.13 embedded/tests/test_smoke.py

      - name: Redis 8.10.2, the differential tests' oracle
        # Built, as on Linux, so both legs ask the same oracle: brew's redis
        # is whatever is current.
        if: env.TIER != 'none'
        run: |
          git clone -q --depth 1 --branch 8.10.2 https://github.com/redis/redis.git "$RUNNER_TEMP/redis"
          make -C "$RUNNER_TEMP/redis" -j"$(sysctl -n hw.ncpu)" BUILD_TLS=no > /dev/null
          echo "$RUNNER_TEMP/redis/src" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/redis/src/redis-server" --version

      - name: Test tier through the library
        if: env.TIER != 'none'
        env:
          PION_EMBED_LIB: ${{ github.workspace }}/libpion.dylib
          PION_EMBED_CTYPES: '1'
        run: |
          python3.12 tests/run_all.py --tier "$TIER" --server-tests-only \
            --binary embedded/tests/pion-server-embedded --report build/embedded-tier.json

      - name: Upload the tier's logs
        if: always() && env.TIER != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-${{ env.TIER }}-tier-macos-arm64
          path: |
            build/test-logs/
            build/embedded-tier.json
          retention-days: 14

      - name: Build the wheel
        run: bash embedded/build_wheel.sh python3.13

      - name: The wheel installs and runs in clean venvs (3.11, 3.13), toolchain hidden
        run: |
          set -e
          W=$(ls embedded/dist/*.whl)
          echo "wheel: $W"
          mv .pixi/envs/default/lib .pixi/envs/default/lib.hidden
          for v in 3.11 3.13; do
            python$v -m venv /tmp/w$v
            /tmp/w$v/bin/pip install --quiet "$W"
            (cd /tmp && /tmp/w$v/bin/python -c "import pion_embedded as p, tempfile; r = p.Redis(dir=tempfile.mkdtemp()); r.ping(); print('$v binding', r.pion_engine.binding)")
            (cd /tmp && /tmp/w$v/bin/python $GITHUB_WORKSPACE/embedded/tests/test_smoke.py)
          done
          mv .pixi/envs/default/lib.hidden .pixi/envs/default/lib

      - name: Keep the wheel
        uses: actions/upload-artifact@v4
        with:
          name: pion-embedded-wheel-macos-arm64
          path: embedded/dist/*.whl

  glibc-235-probe:
    # Can a build on Ubuntu 22.04 (glibc 2.35) take the library's floor below
    # ubuntu-24.04's 2.38? Informational: it reports the highest GLIBC_2.* each
    # shipped file needs and whether the library runs, and never fails CI.
    name: glibc probe (ubuntu-22.04)
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          cache-key: pixi-linux-x86_64-2204-${{ hashFiles('pixi.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Swap, for the compiler's peak
        run: |
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2

      - name: Build libpion.so
        env:
          PION_EMBED_JOBS: '2'
        run: bash embedded/build_linux.sh

      - name: What it needs, and whether it runs
        env:
          PYTHONPATH: embedded/python
          PION_EMBED_LIB: ${{ github.workspace }}/libpion.so
          PION_EMBED_CTYPES: '1'
        run: |
          ldd --version | head -1
          for f in libpion.so .pixi/envs/default/lib/libKGENCompilerRTShared.so \
                   .pixi/envs/default/lib/libAsyncRTRuntimeGlobals.so .pixi/envs/default/lib/libMSupportGlobals.so; do
            echo "$f: $(strings -a "$f" | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n | tail -1)"
          done
          python3.11 -m pip install --quiet redis
          python3.11 embedded/tests/test_smoke.py
